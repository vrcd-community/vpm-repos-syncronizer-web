name: Build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: "NITRO_PRESET=deno_deploy bun run build"

      - name: List workspace
        run: ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-artifact
          path: ./.output
          include-hidden-files: true
          if-no-files-found: error